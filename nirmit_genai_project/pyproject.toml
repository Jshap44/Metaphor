[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "socsci-generative-agents"
version = "0.1.0"
description = "SocSci210 survey response modeling with memory-reflection-planning agents"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "joblib>=1.3", "datasets>=2.18", "pandas>=2.0"]
[project.optional-dependencies]
ui = ["streamlit>=1.35"]
test = ["pytest>=7.0"]
llm = ["anthropic>=0.40"]
[project.scripts]
socsci = "socsci_agents.cli:main"
energy-market = "socsci_agents.energy_cli:main"
monster-backtest = "socsci_agents.historical_cli:main"
brand-backtest = "socsci_agents.multi_brand_cli:main"
genai-study = "socsci_agents.genai_cli:main"
[tool.setuptools.packages.find]
where = ["src"]
